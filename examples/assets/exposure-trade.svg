<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#ffffff"/>
  <g font-family="Manrope, sans-serif" fill="#242521">
    <text x="64" y="76" font-size="44" font-weight="800" letter-spacing="-1">One stop exchanged</text>
    <text x="64" y="120" font-size="26" font-weight="600" fill="#555b4d">ISO 200 and scene lighting stay fixed</text>

    <text x="116" y="178" font-size="20" font-weight="600" fill="#555b4d">Aperture</text>
    <text x="640" y="178" font-size="20" font-weight="600" fill="#555b4d">Exposure time</text>
    <path d="M64 204H1136" stroke="#242521" stroke-width="2"/>

    <text x="64" y="334" font-size="28" font-weight="800">Before</text>
    <circle cx="280" cy="330" r="82" fill="#242521"/>
    <circle cx="280" cy="330" r="44" fill="#ffffff"/>
    <text x="280" y="458" font-size="36" font-weight="800" text-anchor="middle">f/8</text>

    <rect x="640" y="294" width="420" height="48" fill="#4c5346"/>
    <text x="640" y="394" font-size="38" font-weight="800">1/250 second</text>
    <text x="1040" y="270" font-size="22" font-weight="600" fill="#555b4d" text-anchor="end">full exposure time</text>

    <path d="M64 492H1136" stroke="#c9c8bd" stroke-width="2"/>

    <text x="64" y="610" font-size="28" font-weight="800">After</text>
    <circle cx="280" cy="606" r="82" fill="#242521"/>
    <circle cx="280" cy="606" r="62" fill="#ffffff"/>
    <text x="280" y="724" font-size="36" font-weight="800" text-anchor="middle">f/5.6</text>
    <text x="386" y="646" font-size="22" font-weight="600" fill="#555b4d">opening area ×2</text>

    <rect x="640" y="570" width="210" height="48" fill="#4c5346"/>
    <text x="640" y="670" font-size="38" font-weight="800">1/500 second</text>
    <text x="884" y="602" font-size="22" font-weight="600" fill="#555b4d">time ×½</text>
  </g>
</svg>
