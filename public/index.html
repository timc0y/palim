<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta property="csp-nonce" />
    <title>palim</title>
    <meta name="description" content="palim" />
    <meta name="theme-color" content="#efefeb" />
    <link rel="icon" href="/mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/kindle.css" />
    <link
      rel="preload"
      href="/fonts/IBMPlexMono-Latin-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script type="module" src="/landing.js"></script>
  </head>
  <body>
    <a class="skip" href="#page">Skip to content</a>
    <main class="machine" id="page" tabindex="-1" data-skin="hardware">
      <header class="bar">
        <a class="logo" href="/" aria-label="Home">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <path d="M7 10h7l2-2h9M7 16h11l2-2h5M7 22h4" />
          </svg>
        </a>
        <a class="privacy" href="/privacy.html">privacy</a>
      </header>
      <div class="bezel" data-kit="display-bezel">
        <div class="plate" data-kit="display-screen">
          <h1 class="word">palim<span class="caret" aria-hidden="true"></span></h1>
          <details class="connect">
            <summary>connect<span class="connect__indicator" aria-hidden="true"></span></summary>
            <div class="line">
              <pre
                class="line__commands"
                aria-label="Codex installation commands"
              ><code>codex plugin marketplace add timc0y/palim --ref main
codex plugin add palim@palim</code></pre>
              <ui-button pending-announcement="Copying commands">
                <button class="key line__copy" data-kit="button" type="button">copy</button>
              </ui-button>
            </div>
            <a
              class="connect__guide"
              href="https://github.com/timc0y/palim#connect-an-agent"
              rel="noreferrer"
              >connection guide<span aria-hidden="true">↗</span></a
            >
          </details>
        </div>
      </div>
      <p class="sr-only" id="copy-status" role="status"></p>
      <nav class="deck" aria-label="Primary">
        <a class="key" data-kit="button" href="/sample.html">sample</a>
        <a class="key key--go" data-kit="button" data-tone="primary" href="/app">studio</a>
        <a class="key" data-kit="button" href="https://github.com/timc0y/palim" rel="noreferrer"
          >source</a
        >
      </nav>
    </main>
  </body>
</html>
