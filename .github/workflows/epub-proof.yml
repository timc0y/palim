name: EPUB conformance proof
on:
  push:
    paths:
      - .github/workflows/epub-proof.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  epub:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run example
      - name: Install the pinned EPUBCheck distribution
        run: |
          curl --fail --location --retry 2 https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip -o epubcheck.zip
          echo '33350c61038e71dfb3d45a76aed04bf5481e6d5500cb780f6e98db8bbd15a28c  epubcheck.zip' | sha256sum --check
          unzip -q epubcheck.zip -d .local
      - name: Validate generated EPUB
        run: java -jar .local/epubcheck-5.4.0/epubcheck.jar artifacts/palim-sample.epub --failonwarnings 2>&1 | tee artifacts/epubcheck.txt
      - name: Package verification tools
        if: always()
        run: tar -czf epub-proof.tgz artifacts package-lock.json .local/epubcheck-5.4.0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: epub-proof
          path: epub-proof.tgz
          retention-days: 3
