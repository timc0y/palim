name: Lock and verify initial source
on:
  push:
    paths:
      - .github/workflows/bootstrap.yml
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run format
      - run: npm run check
      - run: npm run build
      - name: Dependency security gate
        run: npm audit --omit=dev --audit-level=high
      - name: EPUB conformance
        run: |
          curl --fail --location --retry 2 https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip -o epubcheck.zip
          echo '33350c61038e71dfb3d45a76aed04bf5481e6d5500cb780f6e98db8bbd15a28c  epubcheck.zip' | sha256sum --check
          unzip -q epubcheck.zip -d .local
          java -jar .local/epubcheck-5.4.0/epubcheck.jar artifacts/palim-sample.epub --failonwarnings 2>&1 | tee artifacts/epubcheck.txt
          rm epubcheck.zip
      - name: Commit only the lock and mechanical formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git add -u
          git diff --cached --quiet || git commit -m 'Lock dependencies and format verified Palim source'
          git push
      - name: Package reproducible verification checkout
        if: always()
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-commit.txt
          tar --exclude=node_modules --exclude=.git --exclude=.local --exclude=.wrangler --exclude=dist -czf /tmp/palim-verified-source.tgz .
          tar -czf /tmp/palim-verified-dependencies.tgz node_modules package-lock.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-checkout
          path: |
            /tmp/palim-verified-source.tgz
            /tmp/palim-verified-dependencies.tgz
          retention-days: 2
