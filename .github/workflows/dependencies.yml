name: Dependency bundle
on:
  push:
    paths:
      - package.json
      - .github/workflows/dependencies.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Record dependency inventory
        run: npm ls --all --json > dependency-tree.json
      - name: Pack dependencies for offline verification
        run: tar -czf dependencies.tgz node_modules package-lock.json dependency-tree.json
      - uses: actions/upload-artifact@v4
        with:
          name: dependencies
          path: dependencies.tgz
          retention-days: 1
